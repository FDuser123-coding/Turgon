# The sidecar's log: connector and Camel lifecycle at info, never payloads.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss.SSSZ
# gRPC's server sets SO_KEEPALIVE, which Unix sockets do not have.
org.slf4j.simpleLogger.log.io.grpc.netty.shaded.io.netty.bootstrap.ServerBootstrap=error
