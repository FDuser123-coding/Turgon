# Troubleshoot preflight checks (architecture §11), run before installing:
#   kubectl preflight deploy/preflight.yaml
# Figures follow the sizing profiles in architecture §14.
apiVersion: troubleshoot.sh/v1beta2
kind: Preflight
metadata:
  name: porter
spec:
  analyzers:
    - clusterVersion:
        outcomes:
          - fail:
              when: "< 1.28.0"
              message: Porter needs Kubernetes 1.28 or later.
          - pass:
              message: Kubernetes version is supported.
    - nodeResources:
        checkName: Total CPU for the small profile
        outcomes:
          - fail:
              when: "sum(cpuAllocatable) < 4"
              message: At least 4 allocatable CPUs are required; the small profile plans for 8.
          - warn:
              when: "sum(cpuAllocatable) < 8"
              message: Fewer than 8 CPUs; fine for a pilot, below the small profile.
          - pass:
              message: Enough CPU for the small profile.
    - nodeResources:
        checkName: Total memory for the small profile
        outcomes:
          - fail:
              when: "sum(memoryAllocatable) < 16Gi"
              message: At least 16 GiB of allocatable memory is required; the small profile plans for 32 GiB.
          - warn:
              when: "sum(memoryAllocatable) < 32Gi"
              message: Less than 32 GiB; fine for a pilot, below the small profile.
          - pass:
              message: Enough memory for the small profile.
    - storageClass:
        checkName: Default storage class for Porter's database
        outcomes:
          - fail:
              message: No default storage class. Set database.cloudNativePG.storage.storageClass or create one.
          - pass:
              message: A default storage class exists.
    - customResourceDefinition:
        checkName: CloudNativePG operator
        customResourceDefinitionName: clusters.postgresql.cnpg.io
        outcomes:
          - warn:
              message: CloudNativePG is not installed. Install it, or point database.existingSecret at an existing Postgres.
          - pass:
              message: CloudNativePG is installed.
