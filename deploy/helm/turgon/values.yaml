# Turgon data plane. Everything runs namespace-scoped: no cluster roles, no
# service-account tokens, the Kubernetes "restricted" pod security profile.

image:
  repository: ghcr.io/fduser123-coding/turgon
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The Temporal cluster the workers and console use.
temporal:
  address: temporal-frontend:7233
  namespace: default
  # TLS to the Temporal frontend (implied by a client certificate or an API key).
  tls:
    enabled: false
    serverName: ""         # name in Temporal's certificate (default: the address's host)
    existingSecret: ""     # Secret holding the files below
    caKey: ""              # CA that signed Temporal's certificate (default: the system's)
    certKey: ""            # client certificate and key, for mutual TLS
    keyKey: ""
  # A Secret with Temporal Cloud's API key and the keys that encrypt what
  # Turgon stores in Temporal: "id:base64(32 bytes),...", newest first;
  # older keys stay listed to read older runs. Missing keys are not used.
  existingSecret: ""
  apiKeyKey: apiKey
  payloadKeysKey: payloadKeys

# Turgon's own state: idempotency records, cursors, cross-references and the
# shared audit log. Use an existing database, or let the chart create a
# CloudNativePG cluster (the operator must be installed).
database:
  existingSecret: ""       # Secret holding the connection URL
  existingSecretKey: url
  cloudNativePG:
    enabled: false
    instances: 1           # 3 for the medium and large profiles
    storage:
      size: 20Gi
      storageClass: ""
    # Continuous backup to S3-compatible object storage with the Barman
    # Cloud plugin (installed next to the operator): WAL archiving plus
    # scheduled base backups, so the database can be restored to any point
    # in the retention window.
    backup:
      enabled: false
      destinationPath: ""        # e.g. s3://turgon-backups/prod
      endpointURL: ""            # for S3-compatible stores other than AWS
      credentialsSecret: ""      # Secret with ACCESS_KEY_ID and ACCESS_SECRET_KEY
      retentionPolicy: 30d
      schedule: "0 0 3 * * *"    # daily base backup (six fields, seconds first)
      # Name of this cluster's archive in the store; set a new one when a
      # restored cluster starts archiving, so it never overwrites its source.
      serverName: ""             # default: <release>-turgon-db
    # Create the cluster by restoring a backup instead of an empty database.
    recovery:
      enabled: false
      serverName: ""             # the archive to restore from (default: <release>-turgon-db)
      targetTime: ""             # point in time, e.g. "2026-09-28 10:00:00+00"; empty restores the latest

# Signed runtime specs: with public keys here, workers, MCP servers and
# tests load only specs one of them signed (turgon keygen, then
# turgon compile --sign-key in the pipeline that builds specs). The specs
# carry the policy packs, so loosening a policy means going through that
# pipeline. PEM, one or more "PUBLIC KEY" blocks.
specSigning:
  trustedKeys: ""

# Compiled runtime specs, one worker Deployment each. Pass files with
#   --set-file specs.shop-orders-to-erp=runtime-spec.json
# Keys must be DNS labels. Specs are verified against their digest at start.
specs: {}

# Where connection secrets (the secretRefs in specs) are read from:
#   env      TURGON_SECRET_* variables, from the Secrets in secretEnvFrom.
#   openbao  OpenBao or HashiCorp Vault, KV v2: openbao://shop-db/dsn is the
#            key dsn of <mount>/data/shop-db. Pods sign in as their service
#            account (kubernetes auth), with an AppRole, or with a token.
#   aws      AWS Secrets Manager; azure  Azure Key Vault; gcp  Google Secret
#            Manager. openbao://shop-db/dsn is the field dsn of the JSON
#            secret <prefix>shop-db (Key Vault and Secret Manager names turn
#            "/" into "--"). Pods sign in with the platform's workload
#            identity: set serviceAccount.annotations.
secrets:
  backend: env
  # Put before every cloud secret name, e.g. turgon/ or turgon-.
  prefix: ""
  aws:
    region: ""               # e.g. eu-central-1
  azure:
    vaultURL: ""             # e.g. https://acme-turgon.vault.azure.net
    workloadIdentity: true   # label pods azure.workload.identity/use=true
  gcp:
    project: ""
  openbao:
    address: ""              # e.g. https://openbao.openbao.svc:8200
    mount: secret
    namespace: ""
    auth: kubernetes         # kubernetes, approle or token
    # kubernetes: the role bound to this release's service account and
    # namespace; approle: the role ID.
    role: turgon
    authMount: ""            # default kubernetes or approle
    # The projected token's audience; the role must list it.
    audience: openbao
    # A Secret with ca.crt, when the server's certificate is not publicly signed.
    caSecret: ""
    # approle: a Secret with key secret-id; token: a Secret with key token.
    existingSecret: ""

workers:
  # Logic plugins call only the hosts their manifests are granted, and only
  # at public addresses. List internal address ranges they may reach too
  # (plain http is accepted only for these).
  pluginNetworkAllow: []   # e.g. [10.40.0.0/16]
  replicas: 1
  pollInterval: 2s
  # Requests each worker keeps open to Temporal per task kind: "auto"
  # scales them with the load, or a fixed number.
  pollers: auto
  approvalTimeout: 72h
  # Secrets whose keys become environment variables. Connection secrets are
  # read from TURGON_SECRET_* variables (see `turgon secrets <spec>`), and
  # notification channels from TURGON_NOTIFY_SLACK_WEBHOOK_URL,
  # TURGON_NOTIFY_TEAMS_WEBHOOK_URL or TURGON_NOTIFY_WEBHOOK_URL with
  # TURGON_NOTIFY_WEBHOOK_SECRET: workers tell people when an approval
  # waits, a record needs a steward, or writes could not be undone.
  secretEnvFrom: []
  # The console's public URL, linked from notifications.
  consoleURL: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  # Receive events whose connection configures a webhook (Stripe, Shopify,
  # ...) on port 8082 at /webhooks/<endpoint>/<event>, so runs start within
  # seconds; polling every `reconcile` then only catches missed deliveries.
  # Put the signing secrets in secretEnvFrom (see `turgon secrets <spec>`).
  # The providers must reach the workers: enable the ingress, or route
  # /webhooks/ to the per-spec Services from your own gateway.
  webhooks:
    enabled: false
    reconcile: 5m
    ingress:
      enabled: false
      className: ""
      host: ""               # required with the ingress
      annotations: {}
      tls: []                # e.g. [{secretName: turgon-webhooks-tls, hosts: [hooks.example.com]}]

# The Turgon operator runs each spec as an Integration (turgon.dev/v1alpha1):
# it verifies a spec before rolling it out and keeps the workers on the last
# valid one otherwise, derives the webhook Service and Ingress and the SLO
# alerts from the spec, and reports each Integration's state. With it
# enabled, `specs` become Integrations instead of Deployments rendered here,
# and more Integrations can be applied with kubectl (`turgon integration`).
# The CRD is in the chart's crds/ directory.
operator:
  enabled: false
  replicas: 1              # more stand by; one leads
  defaultReplicas: 2       # workers per Integration that does not say
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

console:
  enabled: true
  replicas: 1
  auth:
    # "oidc": the console signs people in with your OpenID Connect provider
    # itself (Entra ID, Okta, Keycloak, Google...); register
    # <oidc.url>/auth/callback as its redirect URI.
    # "proxy": trust X-Auth-Request-Email/Groups from an authenticating
    # reverse proxy (e.g. oauth2-proxy with your identity provider).
    mode: proxy
    oidc:
      issuer: ""             # e.g. https://login.microsoftonline.com/<tenant>/v2.0
      clientID: ""
      url: ""                # the console's public https URL
      scopes: []             # beyond openid, email and profile, e.g. [groups]
      groupsClaim: groups
      sessionTTL: 8h
      # Secret with TURGON_OIDC_CLIENT_SECRET and TURGON_CONSOLE_SESSION_KEY
      # (at least 32 random characters, e.g. openssl rand -base64 48).
      existingSecret: ""
    trustedProxies: []     # proxy mode: CIDRs the proxy connects from; required
    approverGroup: ""      # required
    # Members resolve records in the data-steward queue (link a source
    # record to its master record and retry the runs waiting on it).
    stewardGroup: ""
    # Members retry failed runs (each retry audited with its reason).
    operatorGroup: ""
    viewerGroup: ""
  # Optional ConfigMap holding catalog specs to show verifier reports for.
  catalogConfigMap: ""
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# Tools for AI agents over MCP, behind agentgateway (architecture §7.7).
# Agents present a JWT from your identity provider; the gateway passes the
# agent, the user it acts for and its roles to Turgon, and lists and allows
# only the tools those roles may use. Each spec's `turgon mcp` runs in the
# gateway's pod on loopback.
agents:
  enabled: false
  specs: []                # spec names to serve; empty serves every spec
  writes: []               # specs whose write tools are served (approval-gated)
  wait: 15s                # how long a write tool call waits for the result
  streamLimit: 1h          # an A2A stream following a write ends after this; the agent resubscribes
  # A2A push notifications go to public https URLs only. List the address
  # ranges of agent platforms inside your network to allow them too (plain
  # http is accepted for these). Workers send the notifications.
  pushAllow: []            # e.g. [10.40.0.0/16]
  gateway:
    image:
      repository: ghcr.io/agentgateway/agentgateway
      tag: v1.5.0          # the version `turgon gateway-config` targets
      pullPolicy: IfNotPresent
    replicas: 1
    issuer: ""             # required: issuer of agents' access tokens
    audiences: []
    jwksURL: ""            # required: the issuer's JWKS
    claims:
      agent: azp           # the agent's client id
      user: sub            # the user it acts for
      roles: roles         # a list of role names
    rateLimit: ""          # per spec, e.g. "100/1m"
    service:
      type: ClusterIP
      port: 3000
    ingress:
      enabled: false
      className: ""
      host: ""
      annotations: {}
      tls: []
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  mcp:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }

# Connectors that run beside each worker in their own container: the
# Camel/Java ones (runtime camel-java, built from connectors/). The worker
# reaches each over the connector protocol on a Unix socket in a volume
# only its pod mounts, and keeps policy, approval, idempotency, rate limits
# and audit; the sidecar only talks to its system. The name is the
# connector's, as specs name it.
connectors:
  sidecars: []
  # - name: sap-ecc
  #   image: { repository: ghcr.io/fduser123-coding/turgon-connector-sap-ecc, tag: "" }
  #   # SAP JCo is SAP's to license and not in the image: mount sapjco3.jar
  #   # and libsapjco3.so (SAP Java Connector 3.1, Linux x86_64) at /opt/turgon/lib.
  #   volumes: [{ name: sapjco, persistentVolumeClaim: { claimName: sapjco } }]
  #   volumeMounts: [{ name: sapjco, mountPath: /opt/turgon/lib, readOnly: true }]
  #   env: []                # e.g. SAP_ROUTER settings, or JAVA_TOOL_OPTIONS
  #   resources: {}          # default: connectors.resources
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

# The Splink service (deploy/splink) scores records for resolve steps with
# strategy: splink: it trains a model per entity on the links in Turgon's
# database (turgon_xref) and answers which master records a new record may
# be. Workers link a certain match and send the rest to a data steward,
# whose links train the next model. It needs only read access to
# turgon_xref: give it a read-only role in database.existingSecret.
splink:
  enabled: false
  url: ""                  # a Splink service run elsewhere, instead of deploying one
  image:
    repository: ghcr.io/fduser123-coding/turgon-splink
    tag: ""                # defaults to the chart's appVersion
    pullPolicy: IfNotPresent
  replicas: 1
  retrain: 300             # seconds between checks for new links
  prior: 0.05              # prior that a record and a blocked candidate are the same entity
  database:
    existingSecret: ""     # default: Turgon's database secret
    existingSecretKey: url
  # A Secret with key "token": the service requires it and workers send it.
  existingSecret: ""
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }

# Prometheus metrics: workers serve /metrics on their health port (8081),
# the console on 9090, each MCP server on 9100 and up.
monitoring:
  # A PodMonitor (Prometheus Operator) scrapes every Turgon pod.
  podMonitor:
    enabled: false
    interval: 30s
    labels: {}             # e.g. release: kube-prometheus-stack
  # Who may scrape (NetworkPolicy "from" entries); empty allows any pod in
  # the namespace. List Prometheus's namespace or pods to narrow it.
  scrapeFrom: []
  # A PrometheusRule with Turgon's alerts, including one per recipe latency
  # SLO (spec.slo.p95Latency, measured without the time runs wait for people).
  rules:
    enabled: false
    labels: {}
    runFailureRatio: 0.05      # a workflow's failed runs over an hour
    pollStalledMinutes: 15     # since a source was last polled successfully
    breakerOpenMinutes: 5      # a target refusing writes
    webhookRejections: 20      # unauthenticated deliveries per 15 minutes
    cdcRetainedWALMiB: 4096    # write-ahead log a change capture slot holds

networkPolicy:
  enabled: true
  # Who may reach the console (NetworkPolicy "from" entries). Empty allows
  # any pod in the namespace, e.g. the authenticating proxy.
  consoleFrom: []
  # Who may reach the agent gateway. Empty allows any pod in the namespace.
  agentsFrom: []
  # Who may reach the workers' webhook port. Empty allows any pod in the
  # namespace; list your ingress controller's pods to narrow it.
  webhooksFrom: []
  # Egress. With allowAllEgress false, only DNS and egressRules are allowed:
  # list Temporal, the state database, every connected system and the secret
  # manager (OpenBao, the cloud's endpoint; on GKE also the metadata server,
  # 169.254.169.254:80, which Workload Identity tokens come from), and, for
  # A2A push notifications, the agents' receivers (443), and the hosts logic
  # plugins are granted.
  allowAllEgress: true
  egressRules: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
affinity: {}

# The service account the pods run as. Its annotations bind it to a cloud
# identity for the secret manager, e.g.
#   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/turgon
#   azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
#   iam.gke.io/gcp-service-account: turgon@acme-prod.iam.gserviceaccount.com
serviceAccount:
  annotations: {}
