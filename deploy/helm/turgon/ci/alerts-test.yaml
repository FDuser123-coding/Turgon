# promtool test rules for the chart's PrometheusRule (CI renders the chart
# with monitoring.rules.enabled and the shop-orders-to-erp spec, whose
# latency SLO is 2s, into rules.yaml next to this file).
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  # Runs take 5s against a 2s SLO: the SLO alert fires after 15 minutes.
  - interval: 1m
    input_series:
      - series: 'turgon_run_active_seconds_bucket{workflow="shop-orders-to-erp",le="2.5"}'
        values: '0+0x60'
      - series: 'turgon_run_active_seconds_bucket{workflow="shop-orders-to-erp",le="5"}'
        values: '0+10x60'
      - series: 'turgon_run_active_seconds_bucket{workflow="shop-orders-to-erp",le="+Inf"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: TurgonRecipeLatencySLO
        exp_alerts: []
      - eval_time: 50m
        alertname: TurgonRecipeLatencySLO
        exp_alerts:
          - exp_labels: { severity: warning, workflow: shop-orders-to-erp }
            exp_annotations:
              summary: "shop-orders-to-erp: p95 run time above its 2s SLO"
              description: "95% of shop-orders-to-erp runs should finish within 2s, not counting approvals. Check the target systems' latency (turgon_write_duration_seconds) and open circuit breakers."
  # A failed compensation pages at once; a stalled poller after its window.
  - interval: 1m
    input_series:
      - series: 'turgon_runs_finished_total{workflow="w",outcome="failed",reason="TurgonCompensationFailed"}'
        values: '0 0 1 1 1'
      - series: 'turgon_last_poll_success_timestamp_seconds{workflow="w"}'
        values: '0x40'
      - series: 'turgon_breaker_open{target="erp-db"}'
        values: '0 1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: TurgonCompensationFailed
        exp_alerts:
          - exp_labels: { severity: critical, workflow: w }
            exp_annotations:
              summary: "w: a saga could not undo its writes"
              description: "A run failed and at least one compensation failed too, so a target system holds a partial result. An operator must act; the run's notification lists the writes."
      - eval_time: 10m
        alertname: TurgonPollingStalled
        exp_alerts: []
      - eval_time: 25m
        alertname: TurgonPollingStalled
        exp_alerts:
          - exp_labels: { severity: warning, workflow: w }
            exp_annotations:
              summary: "w: its source has not been polled successfully for 15 minutes"
              description: "Events are not being read. turgon_poll_errors_total and the worker's log say why; `turgon check` explains connection problems."
      - eval_time: 3m
        alertname: TurgonCircuitOpen
        exp_alerts: []
      - eval_time: 8m
        alertname: TurgonCircuitOpen
        exp_alerts:
          - exp_labels: { severity: warning, target: erp-db }
            exp_annotations:
              summary: "erp-db: writes are refused after repeated failures"
              description: "The target failed repeatedly; the breaker retries after its cooldown. Check the system's health and turgon_writes_total{status=\"failed\"}."
  # Few failures are noise; many are an alert.
  - interval: 1m
    input_series:
      - series: 'turgon_runs_finished_total{workflow="w",outcome="completed",reason=""}'
        values: '0+10x60'
      - series: 'turgon_runs_finished_total{workflow="w",outcome="failed",reason="TurgonInvalid"}'
        values: '0+2x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: TurgonRunsFailing
        exp_alerts:
          - exp_labels: { severity: warning, workflow: w }
            exp_annotations:
              summary: "w: more than 5% of runs failed in the last hour"
              description: "See the failed runs in the console; turgon_runs_finished_total's reason label says why."
  # A change capture slot whose worker stopped holds ever more log.
  - interval: 1m
    input_series:
      - series: 'turgon_cdc_retained_wal_bytes{slot="turgon_order_placed",pod="worker-0"}'
        values: '1e9+1e8x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: TurgonChangeCaptureRetainingWAL
        exp_alerts: []
      - eval_time: 50m
        alertname: TurgonChangeCaptureRetainingWAL
        exp_alerts:
          - exp_labels: { severity: warning, slot: turgon_order_placed }
            exp_annotations:
              summary: "turgon_order_placed: the source database keeps more than 4096 MiB of write-ahead log for change capture"
              description: "The slot advances only as events are dispatched. Workers stopped or failing to start runs make the database keep its log until the disk fills; max_slot_wal_keep_size bounds it. A slot no longer used should be dropped."
