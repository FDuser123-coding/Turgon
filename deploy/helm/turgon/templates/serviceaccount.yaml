apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "turgon.fullname" . }}
  labels:
    {{- include "turgon.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  # Workload identity: eks.amazonaws.com/role-arn (IRSA),
  # azure.workload.identity/client-id, iam.gke.io/gcp-service-account.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
