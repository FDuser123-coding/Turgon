{{- if .Values.agents.enabled }}
{{- $g := .Values.agents.gateway }}
---
# `helm test` has the agent gateway itself validate the configuration
# `turgon gateway-config` generates for this release.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "turgon.fullname" . }}-check-agents
  labels:
    {{- include "turgon.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  {{- include "turgon.podSettings" . | nindent 2 }}
  initContainers:
    - name: gateway-config
      image: {{ include "turgon.image" . }}
      args:
        {{- include "turgon.gatewayConfigArgs" . | nindent 8 }}
        - --output=/config/config.yaml
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      volumeMounts:
        - { name: specs, mountPath: /specs, readOnly: true }
        - { name: config, mountPath: /config }
  containers:
    - name: validate
      image: "{{ $g.image.repository }}:{{ $g.image.tag }}"
      args: [--validate-only, --file=/config/config.yaml]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      volumeMounts:
        - { name: config, mountPath: /config, readOnly: true }
        - { name: tmp, mountPath: /tmp }
  volumes:
    - name: specs
      configMap:
        name: {{ include "turgon.fullname" . }}-specs
    - name: config
      emptyDir: { sizeLimit: 1Mi }
    - name: tmp
      emptyDir: { sizeLimit: 16Mi }
{{- end }}
