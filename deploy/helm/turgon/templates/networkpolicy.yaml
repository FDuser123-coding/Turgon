{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "turgon.fullname" . }}-default
  labels:
    {{- include "turgon.labels" . | nindent 4 }}
spec:
  # Turgon pods accept no connections except those allowed below.
  podSelector:
    matchLabels:
      {{- include "turgon.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- if .Values.networkPolicy.allowAllEgress }}
    - {}
    {{- else }}
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- with .Values.networkPolicy.egressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
{{- if .Values.console.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "turgon.fullname" . }}-console
  labels:
    {{- include "turgon.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "turgon.selector" . | nindent 6 }}
      app.kubernetes.io/component: console
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8080 }
      from:
        {{- if .Values.networkPolicy.consoleFrom }}
        {{- toYaml .Values.networkPolicy.consoleFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
{{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.agents.enabled }}
---
# Only the gateway port is open; the MCP servers listen on loopback.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "turgon.fullname" . }}-agents
  labels:
    {{- include "turgon.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "turgon.selector" . | nindent 6 }}
      app.kubernetes.io/component: agents
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 3000 }
      from:
        {{- if .Values.networkPolicy.agentsFrom }}
        {{- toYaml .Values.networkPolicy.agentsFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.workers.webhooks.enabled }}
---
# Webhook deliveries reach the workers' webhook port only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "turgon.fullname" . }}-webhooks
  labels:
    {{- include "turgon.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "turgon.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8082 }
      from:
        {{- if .Values.networkPolicy.webhooksFrom }}
        {{- toYaml .Values.networkPolicy.webhooksFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
{{- end }}
