{{- range $name, $spec := .Values.specs }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "turgon.fullname" $ }}-worker-{{ $name }}
  labels:
    {{- include "turgon.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    turgon.dev/spec: {{ $name }}
spec:
  replicas: {{ $.Values.workers.replicas }}
  selector:
    matchLabels:
      {{- include "turgon.selector" $ | nindent 6 }}
      app.kubernetes.io/component: worker
      turgon.dev/spec: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "turgon.selector" $ | nindent 8 }}
        app.kubernetes.io/component: worker
        turgon.dev/spec: {{ $name }}
      annotations:
        # Roll the worker when its spec changes.
        turgon.dev/spec-checksum: {{ $spec | sha256sum }}
    spec:
      {{- include "turgon.podSettings" $ | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "turgon.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - run
            - --spec=/specs/{{ $name }}.json
            - --audit-log=postgres
            - --health-listen=:8081
            - --poll={{ $.Values.workers.pollInterval }}
            - --approval-timeout={{ $.Values.workers.approvalTimeout }}
            {{- if $.Values.workers.webhooks.enabled }}
            - --webhook-listen=:8082
            - --reconcile={{ $.Values.workers.webhooks.reconcile }}
            {{- end }}
          env:
            {{- include "turgon.commonEnv" $ | nindent 12 }}
          {{- with $.Values.workers.secretEnvFrom }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          ports:
            - name: health
              containerPort: 8081
            {{- if $.Values.workers.webhooks.enabled }}
            - name: webhooks
              containerPort: 8082
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $.Values.workers.resources | nindent 12 }}
          volumeMounts:
            - { name: specs, mountPath: /specs, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: specs
          configMap:
            name: {{ include "turgon.fullname" $ }}-specs
            items:
              - { key: {{ $name }}.json, path: {{ $name }}.json }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
{{- if $.Values.workers.webhooks.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "turgon.fullname" $ }}-webhooks-{{ $name }}
  labels:
    {{- include "turgon.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    turgon.dev/spec: {{ $name }}
spec:
  selector:
    {{- include "turgon.selector" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    turgon.dev/spec: {{ $name }}
  ports:
    - { name: webhooks, port: 8082, targetPort: webhooks }
{{- end }}
{{- end }}
{{- with .Values.workers.webhooks }}
{{- if and .enabled .ingress.enabled }}
{{- if not .ingress.host }}
{{- fail "workers.webhooks.ingress.host is required" }}
{{- end }}
---
# Only the webhook paths of each spec's webhook events are routed, each to
# the workers of its spec.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "turgon.fullname" $ }}-webhooks
  labels:
    {{- include "turgon.labels" $ | nindent 4 }}
  {{- with .ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .ingress.host | quote }}
      http:
        paths:
          {{- $paths := 0 }}
          {{- range $name, $spec := $.Values.specs }}
          {{- $s := $spec | fromJson }}
          {{- range $wf := $s.spec.workflows }}
          {{- range $c := $s.spec.connectors }}
          {{- if and (eq $c.endpoint $wf.trigger.endpoint) (dig "config" "events" $wf.trigger.event "webhook" "" $c) }}
          {{- $paths = add1 $paths }}
          - path: /webhooks/{{ $wf.trigger.endpoint }}/{{ $wf.trigger.event }}
            pathType: Exact
            backend:
              service:
                name: {{ include "turgon.fullname" $ }}-webhooks-{{ $name }}
                port: { name: webhooks }
          {{- end }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if eq $paths 0 }}
          {{- fail "workers.webhooks.ingress: no spec has an event configured for webhooks" }}
          {{- end }}
{{- end }}
{{- end }}
