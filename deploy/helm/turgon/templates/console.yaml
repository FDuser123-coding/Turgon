{{- if .Values.console.enabled }}
{{- $auth := .Values.console.auth }}
{{- if ne $auth.mode "proxy" }}{{ fail "console.auth.mode must be proxy in a cluster; dev mode only listens on loopback" }}{{ end }}
{{- if not $auth.trustedProxies }}{{ fail "console.auth.trustedProxies is required" }}{{ end }}
{{- if not $auth.approverGroup }}{{ fail "console.auth.approverGroup is required" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "turgon.fullname" . }}-console
  labels:
    {{- include "turgon.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      {{- include "turgon.selector" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "turgon.selector" . | nindent 8 }}
        app.kubernetes.io/component: console
    spec:
      {{- include "turgon.podSettings" . | nindent 6 }}
      containers:
        - name: console
          image: {{ include "turgon.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - console
            - --listen=0.0.0.0:8080
            - --auth=proxy
            - --trusted-proxy={{ join "," $auth.trustedProxies }}
            - --approver-group={{ $auth.approverGroup }}
            {{- with $auth.viewerGroup }}
            - --viewer-group={{ . }}
            {{- end }}
            - --audit-log=postgres
            {{- if .Values.console.catalogConfigMap }}
            - --catalog=/catalog
            {{- end }}
          env:
            {{- include "turgon.commonEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.console.catalogConfigMap }}
            - { name: catalog, mountPath: /catalog, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
        {{- if .Values.console.catalogConfigMap }}
        - name: catalog
          configMap:
            name: {{ .Values.console.catalogConfigMap }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "turgon.fullname" . }}-console
  labels:
    {{- include "turgon.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: {{ .Values.console.service.type }}
  selector:
    {{- include "turgon.selector" . | nindent 4 }}
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
{{- if .Values.console.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "turgon.fullname" . }}-console
  labels:
    {{- include "turgon.labels" . | nindent 4 }}
  {{- with .Values.console.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.console.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.console.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "console.ingress.host is required" .Values.console.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "turgon.fullname" . }}-console
                port: { name: http }
{{- end }}
{{- end }}
