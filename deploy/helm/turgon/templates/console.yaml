{{- if .Values.console.enabled }}
{{- $auth := .Values.console.auth }}
{{- if not (has $auth.mode (list "proxy" "oidc")) }}{{ fail "console.auth.mode must be proxy or oidc in a cluster; dev mode only listens on loopback" }}{{ end }}
{{- if and (eq $auth.mode "proxy") (not $auth.trustedProxies) }}{{ fail "console.auth.trustedProxies is required in proxy mode" }}{{ end }}
{{- if eq $auth.mode "oidc" }}
{{- range $k := list "issuer" "clientID" "url" "existingSecret" }}
{{- if not (index $auth.oidc $k) }}{{ fail (printf "console.auth.oidc.%s is required in oidc mode" $k) }}{{ end }}
{{- end }}
{{- if not (hasPrefix "https://" $auth.oidc.url) }}{{ fail "console.auth.oidc.url must be https" }}{{ end }}
{{- end }}
{{- if not $auth.approverGroup }}{{ fail "console.auth.approverGroup is required" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "turgon.fullname" . }}-console
  labels:
    {{- include "turgon.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      {{- include "turgon.selector" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "turgon.selector" . | nindent 8 }}
        app.kubernetes.io/component: console
    spec:
      {{- include "turgon.podSettings" . | nindent 6 }}
      containers:
        - name: console
          image: {{ include "turgon.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - console
            - --listen=0.0.0.0:8080
            - --auth={{ $auth.mode }}
            {{- if eq $auth.mode "proxy" }}
            - --trusted-proxy={{ join "," $auth.trustedProxies }}
            {{- else }}
            - --oidc-issuer={{ $auth.oidc.issuer }}
            - --oidc-client-id={{ $auth.oidc.clientID }}
            - --url={{ $auth.oidc.url }}
            - --oidc-groups-claim={{ $auth.oidc.groupsClaim }}
            - --session-ttl={{ $auth.oidc.sessionTTL }}
            {{- with $auth.oidc.scopes }}
            - --oidc-scopes={{ join "," . }}
            {{- end }}
            {{- end }}
            - --approver-group={{ $auth.approverGroup }}
            {{- with $auth.stewardGroup }}
            - --steward-group={{ . }}
            {{- end }}
            {{- with $auth.operatorGroup }}
            - --operator-group={{ . }}
            {{- end }}
            {{- with $auth.viewerGroup }}
            - --viewer-group={{ . }}
            {{- end }}
            - --audit-log=postgres
            {{- if .Values.console.catalogConfigMap }}
            - --catalog=/catalog
            {{- end }}
          env:
            {{- include "turgon.commonEnv" . | nindent 12 }}
          {{- if eq $auth.mode "oidc" }}
          envFrom:
            - secretRef:
                name: {{ $auth.oidc.existingSecret }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.console.catalogConfigMap }}
            - { name: catalog, mountPath: /catalog, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
        {{- if .Values.console.catalogConfigMap }}
        - name: catalog
          configMap:
            name: {{ .Values.console.catalogConfigMap }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "turgon.fullname" . }}-console
  labels:
    {{- include "turgon.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: {{ .Values.console.service.type }}
  selector:
    {{- include "turgon.selector" . | nindent 4 }}
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
{{- if .Values.console.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "turgon.fullname" . }}-console
  labels:
    {{- include "turgon.labels" . | nindent 4 }}
  {{- with .Values.console.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.console.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.console.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "console.ingress.host is required" .Values.console.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "turgon.fullname" . }}-console
                port: { name: http }
{{- end }}
{{- end }}
