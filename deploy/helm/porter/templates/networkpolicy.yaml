{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "porter.fullname" . }}-default
  labels:
    {{- include "porter.labels" . | nindent 4 }}
spec:
  # Porter pods accept no connections except those allowed below.
  podSelector:
    matchLabels:
      {{- include "porter.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- if .Values.networkPolicy.allowAllEgress }}
    - {}
    {{- else }}
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- with .Values.networkPolicy.egressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
{{- if .Values.console.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "porter.fullname" . }}-console
  labels:
    {{- include "porter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "porter.selector" . | nindent 6 }}
      app.kubernetes.io/component: console
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8080 }
      from:
        {{- if .Values.networkPolicy.consoleFrom }}
        {{- toYaml .Values.networkPolicy.consoleFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
{{- end }}
{{- end }}
