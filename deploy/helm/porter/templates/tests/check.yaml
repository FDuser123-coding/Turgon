{{- range $name, $spec := .Values.specs }}
---
# `helm test` runs the Connect-stage checks for every spec.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "porter.fullname" $ }}-check-{{ $name }}
  labels:
    {{- include "porter.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  {{- include "porter.podSettings" $ | nindent 2 }}
  containers:
    - name: check
      image: {{ include "porter.image" $ }}
      args: [check, --spec=/specs/{{ $name }}.json]
      env:
        {{- include "porter.commonEnv" $ | nindent 8 }}
      {{- with $.Values.workers.secretEnvFrom }}
      envFrom:
        {{- range . }}
        - secretRef:
            name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.securityContext | nindent 8 }}
      volumeMounts:
        - { name: specs, mountPath: /specs, readOnly: true }
  volumes:
    - name: specs
      configMap:
        name: {{ include "porter.fullname" $ }}-specs
{{- end }}
