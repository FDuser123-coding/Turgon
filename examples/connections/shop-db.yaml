# The web shop's database. Orders are announced through a transactional
# outbox written in the same transaction as the order (Order.Created), and
# read from the orders table itself by change capture (Order.Placed).
apiVersion: turgon.dev/v1alpha1
kind: Connection
metadata:
  name: shop-db
  description: "The web shop's database: orders, announced through an outbox or read from its log."
spec:
  connector: postgres@^1
  secretRef: openbao://shop-db/dsn
  entities: [Order]
  events:
    - { name: Order.Created, entity: Order, interface: outbox }
    - { name: Order.Placed, entity: Order, interface: logical-replication }
  config:
    outbox: { table: shop.outbox }
    changes:
      Order.Placed: { table: shop.orders, operations: [insert] }
