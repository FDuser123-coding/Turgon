# A custom ERP that keeps sales orders in Postgres.
apiVersion: porter.dev/v1alpha1
kind: Connection
metadata: { name: erp-db }
spec:
  connector: postgres@^1
  secretRef: openbao://erp-db/dsn
  entities: [Customer, SalesOrder]
  operations:
    - { name: create-sales-order, entity: SalesOrder, direction: write, interface: jdbc, risk: high, compensation: cancel-sales-order }
    - { name: cancel-sales-order, entity: SalesOrder, direction: write, interface: jdbc, risk: high }
  config:
    operations:
      create-sales-order:
        table: erp.sales_orders
        action: insert
        key: external_id
        columns: [external_id, customer_id, order_date, net_value, currency, lines]
      cancel-sales-order:
        table: erp.sales_orders
        action: update
        key: external_id
        set: { status: cancelled }
