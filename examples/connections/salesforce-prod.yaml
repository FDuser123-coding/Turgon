# The sales org, reached as a dedicated integration user with the OAuth 2.0
# JWT bearer flow. The secret holds loginUrl, clientId, username and the
# user's private key (see pkg/connector/salesforce.Credentials).
apiVersion: turgon.dev/v1alpha1
kind: Connection
metadata:
  name: salesforce-prod
  description: "The Salesforce sales org, reached as a dedicated integration user."
spec:
  connector: salesforce@^3
  secretRef: openbao://salesforce/prod-jwt
  events:
    # The same deals, pushed by change data capture over the Pub/Sub API.
    - { name: Opportunity.Won, entity: Opportunity, interface: change-data-capture }
  config:
    apiVersion: "61.0"
    events:
      Opportunity.ClosedWon:
        sobject: Opportunity
        where: "StageName = 'Closed Won'"
        fields:
          - Id
          - AccountId
          - Amount
          - CloseDate
          - CurrencyIsoCode
          - "(SELECT Product2.ProductCode, Quantity FROM OpportunityLineItems)"
    subscriptions:
      Opportunity.Won:
        topic: /data/OpportunityChangeEvent
        changeTypes: [UPDATE]
        match: { StageName: Closed Won }
        # A change event carries only what changed: read what the flow needs.
        fields:
          - AccountId
          - Amount
          - CloseDate
          - CurrencyIsoCode
          - "(SELECT Product2.ProductCode, Quantity FROM OpportunityLineItems)"
    # Read at once with the Bulk API: the accounts that carry their ERP
    # customer number, to link them all to master records at go-live
    # (turgon xref load salesforce-prod Account.ERPNumbers ...).
    exports:
      Account.ERPNumbers:
        sobject: Account
        fields: [Id, Name, ERP_Customer_Number__c]
        where: "ERP_Customer_Number__c != null"
    operations:
      update-opportunity:
        sobject: Opportunity
        action: update
        idField: opportunityId
        fields: { ERP_Order_Number__c: erpOrderNumber }
      restore-opportunity:
        sobject: Opportunity
        action: restore
      get-customer:
        sobject: Account
        action: get
        fields: { Name: name, BillingCity: city, BillingCountry: country, Industry: industry }
