apiVersion: porter.dev/v1alpha1
kind: ConnectorManifest
metadata:
  name: salesforce
  version: 3.2.0
spec:
  system: "Salesforce Sales Cloud, API v60+"
  # Native in the prototype worker; production runs on the Camel worker (§7.1).
  runtime: native
  auth:
    methods: [oauth2-jwt, oauth2-client-credentials]
    secretRef: openbao://salesforce/prod
  discovery:
    - kind: openapi
  interfaces:
    read:
      - kind: rest-api
      - kind: bulk-api
    write:
      # No server-side dry run exists for REST writes; the preview shows the
      # record's current values next to the proposed ones.
      - kind: rest-api
        simulation: preview
    events:
      - kind: change-data-capture
      - kind: platform-events
      # SOQL on SystemModstamp through the REST API; replaced by a Pub/Sub
      # API change-data-capture subscriber later.
      - kind: soql-poll
  entities: [Customer, Opportunity]
  events:
    - name: Opportunity.ClosedWon
      entity: Opportunity
      interface: soql-poll
  operations:
    - name: get-customer
      entity: Customer
      direction: read
      interface: rest-api
      risk: read
    - name: update-opportunity
      entity: Opportunity
      direction: write
      interface: rest-api
      risk: low
      compensation: restore-opportunity
    - name: restore-opportunity
      entity: Opportunity
      direction: write
      interface: rest-api
      risk: low
  limits:
    maxConcurrentCalls: 10
    requestsPerSecond: 20
  semanticBindings:
    - template: ossie://porter/distribution/customer@1
