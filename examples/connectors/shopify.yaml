apiVersion: porter.dev/v1alpha1
kind: ConnectorManifest
metadata:
  name: shopify
  version: 2.0.3
spec:
  system: "Shopify Admin API 2026-07"
  runtime: camel-java
  auth:
    methods: [oauth2]
    secretRef: openbao://shopify/store
  discovery:
    - kind: graphql-introspection
  interfaces:
    read:
      - kind: graphql-api
    write:
      - kind: graphql-api
    events:
      - kind: webhooks
  entities: [Customer, Order]
  events:
    - name: Order.Created
      entity: Order
      interface: webhooks
  operations:
    - name: get-order
      entity: Order
      direction: read
      interface: graphql-api
      risk: read
  limits:
    maxConcurrentCalls: 4
    requestsPerSecond: 2
