# The Shopify saga with SAP S/4HANA as the ERP: each new Shopify order
# becomes an S/4HANA sales order, priced and checked by SAP's simulation
# service first so the approver sees SAP's own totals; then the SAP order
# number is noted on the Shopify order. If the note cannot be written, the
# SAP order is deleted.
apiVersion: turgon.dev/v1alpha1
kind: Recipe
metadata:
  name: shopify-store-orders-to-s4
  version: 1.0.0
spec:
  trigger:
    source: shopify-store
    event: Order.Created
  steps:
    - map:
        from: shopify-store.Order
        to: model.SalesOrder
        mapping: shopify-rest-order-to-order@1
    # The master record's ID is the SAP customer number (SoldToParty).
    - resolve:
        entity: model.Customer
        strategy: probabilistic
        autoMatchAbove: 0.95
        match:
          - { field: customerRef, kind: email }
          - { field: customerRef, kind: domain }
    - write:
        target: s4-prod
        operation: create-sales-order
        # At most 35 characters: it is stored in PurchaseOrderByCustomer.
        idempotencyKey: "SHOPIFY-{{ source.id }}"
        simulate: true
        output: erpOrder
    - map:
        from: model.SalesOrder
        to: model.Order
        mapping: sales-order-to-shopify-note@1
    - write:
        target: shopify-store
        operation: update-order
        idempotencyKey: "SHOPIFY-{{ source.id }}"
        simulate: true
  policies: [writeback-default]
  capacity:
    peakPerSecond: 1
  slo:
    p95Latency: 10s
