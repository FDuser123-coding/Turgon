# The Shopify saga with Xero as the books: each new (paid) Shopify order
# becomes an authorised Xero sales invoice (a retried create is answered
# with the first one's invoice, by Idempotency-Key), and its invoice number
# is noted on the Shopify order. If the note cannot be written, the invoice
# is voided.
apiVersion: turgon.dev/v1alpha1
kind: Recipe
metadata:
  name: shopify-store-orders-to-xero
  version: 1.1.0
  description: "A paid Shopify order becomes an authorised Xero invoice; its number is added to the Shopify order as a note."
spec:
  trigger:
    source: shopify-store
    event: Order.Created
  steps:
    - map:
        from: shopify-store.Order
        to: model.SalesOrder
        mapping: shopify-rest-order-to-order@1
    # The master record's ID is the Xero contact's ID.
    - resolve:
        entity: model.Customer
        strategy: probabilistic
        autoMatchAbove: 0.95
        match:
          - { field: customerRef, kind: email }
          - { field: customerRef, kind: domain }
    - map:
        from: model.SalesOrder
        to: model.SalesOrder
        mapping: sales-order-to-xero-invoice@1
    - write:
        target: xero
        operation: create-invoice
        idempotencyKey: "SHOPIFY-{{ source.id }}"
        simulate: true
        output: erpOrder
        # The ERP's order, linked to its Shopify order.
        link: { entity: model.SalesOrder, id: InvoiceID, master: shopifyId }
    - map:
        from: model.SalesOrder
        to: model.Order
        mapping: sales-order-to-shopify-note@1
    - write:
        target: shopify-store
        operation: update-order
        idempotencyKey: "SHOPIFY-{{ source.id }}"
        simulate: true
  policies: [writeback-default]
  capacity:
    peakPerSecond: 0.5
  slo:
    p95Latency: 10s
