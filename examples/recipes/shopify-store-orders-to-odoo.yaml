# The Shopify saga with Odoo as the ERP: each new Shopify order becomes an
# Odoo quotation (a retried create finds it by its customer reference), and
# its number is noted on the Shopify order. If the note cannot be written,
# the quotation is cancelled.
apiVersion: turgon.dev/v1alpha1
kind: Recipe
metadata:
  name: shopify-store-orders-to-odoo
  version: 1.1.0
  description: "A Shopify order becomes an Odoo quotation, checked against Odoo's own pricing; its number is added to the Shopify order as a note."
spec:
  trigger:
    source: shopify-store
    event: Order.Created
  steps:
    - map:
        from: shopify-store.Order
        to: model.SalesOrder
        mapping: shopify-rest-order-to-order@1
    # The master record's ID is the Odoo partner's ID.
    - resolve:
        entity: model.Customer
        strategy: probabilistic
        autoMatchAbove: 0.95
        match:
          - { field: customerRef, kind: email }
          - { field: customerRef, kind: domain }
    - map:
        from: model.SalesOrder
        to: model.SalesOrder
        mapping: sales-order-to-odoo-order@1
    - write:
        target: odoo-erp
        operation: create-sales-order
        idempotencyKey: "SHOPIFY-{{ source.id }}"
        simulate: true
        # Odoo prices the quotation in the dry run (onchange): when its
        # untaxed total differs from the shop's by more than 1%, a person is asked.
        checkAmount: { preview: record.amount_untaxed, tolerance: 0.01 }
        output: erpOrder
        # The ERP's order, linked to its Shopify order.
        link: { entity: model.SalesOrder, id: id, master: shopifyId }
    - map:
        from: model.SalesOrder
        to: model.Order
        mapping: sales-order-to-shopify-note@1
    - write:
        target: shopify-store
        operation: update-order
        idempotencyKey: "SHOPIFY-{{ source.id }}"
        simulate: true
  policies: [writeback-default]
  capacity:
    peakPerSecond: 1
  slo:
    p95Latency: 10s
