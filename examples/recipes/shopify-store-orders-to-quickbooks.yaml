# The Shopify saga with QuickBooks Online as the books: each new (paid)
# Shopify order becomes a QuickBooks sales receipt (a retried create is
# answered with the first one's receipt, by requestid), and its document
# number is noted on the Shopify order. If the note cannot be written, the
# receipt is voided.
apiVersion: turgon.dev/v1alpha1
kind: Recipe
metadata:
  name: shopify-store-orders-to-quickbooks
  version: 1.0.0
  description: "A paid Shopify order becomes a QuickBooks Online sales receipt; its number is added to the Shopify order as a note."
spec:
  trigger:
    source: shopify-store
    event: Order.Created
  steps:
    - map:
        from: shopify-store.Order
        to: model.SalesOrder
        mapping: shopify-rest-order-to-order@1
    # The master record's ID is the QuickBooks customer's ID.
    - resolve:
        entity: model.Customer
        strategy: probabilistic
        autoMatchAbove: 0.95
        match:
          - { field: customerRef, kind: email }
          - { field: customerRef, kind: domain }
    - map:
        from: model.SalesOrder
        to: model.SalesOrder
        mapping: sales-order-to-quickbooks-receipt@1
    - write:
        target: quickbooks
        operation: create-sales-receipt
        idempotencyKey: "SHOPIFY-{{ source.id }}"
        simulate: true
        output: erpOrder
    - map:
        from: model.SalesOrder
        to: model.Order
        mapping: sales-order-to-shopify-note@1
    - write:
        target: shopify-store
        operation: update-order
        idempotencyKey: "SHOPIFY-{{ source.id }}"
        simulate: true
  policies: [writeback-default]
  capacity:
    peakPerSecond: 1
  slo:
    p95Latency: 10s
