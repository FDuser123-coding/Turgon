# Order entry from the CRM into Dynamics 365: every deal won in HubSpot
# becomes a Dataverse sales order for the resolved account, and the order's
# ID is recorded on the deal. If the deal cannot be updated, the order is
# deleted. Orders are high risk, so each waits for approval.
apiVersion: turgon.dev/v1alpha1
kind: Recipe
metadata:
  name: hubspot-won-deals-to-dynamics
  version: 1.0.0
  description: "A deal won in HubSpot becomes a sales order in Dynamics 365; the order number is written back to the deal."
spec:
  trigger:
    source: hubspot-crm
    event: Deal.Won
  steps:
    - map:
        from: hubspot-crm.Deal
        to: model.SalesOrder
        mapping: hubspot-deal-to-order@1
    # The master record's ID is the Dataverse account's GUID.
    - resolve:
        entity: model.Customer
        strategy: probabilistic
        autoMatchAbove: 0.95
        match:
          - { field: customerRef, kind: email }
          - { field: customerRef, kind: domain }
    - map:
        from: model.SalesOrder
        to: model.SalesOrder
        mapping: sales-order-to-dynamics-order@1
    - write:
        target: dynamics-crm
        operation: create-sales-order
        idempotencyKey: "hubspot-deal-{{ source.id }}"
        simulate: true
        output: erpOrder
    - map:
        from: model.SalesOrder
        to: model.Deal
        mapping: sales-order-to-hubspot-link@1
    - write:
        target: hubspot-crm
        operation: link-deal
        idempotencyKey: "hubspot-deal-{{ source.id }}"
        simulate: true
  policies: [writeback-default]
  capacity:
    peakPerSecond: 1
  slo:
    p95Latency: 10s
