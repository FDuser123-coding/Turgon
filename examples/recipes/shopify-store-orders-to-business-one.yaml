# The Shopify saga with SAP Business One as the ERP: each new Shopify order
# becomes a Business One sales order (a retried create finds it by
# NumAtCard), and its document number is noted on the Shopify order. If the
# note cannot be written, the order is cancelled.
apiVersion: turgon.dev/v1alpha1
kind: Recipe
metadata:
  name: shopify-store-orders-to-business-one
  version: 1.1.0
  description: "A Shopify order becomes an SAP Business One sales order; its document number is added to the Shopify order as a note."
spec:
  trigger:
    source: shopify-store
    event: Order.Created
  steps:
    - map:
        from: shopify-store.Order
        to: model.SalesOrder
        mapping: shopify-rest-order-to-order@1
    # The master record's ID is the Business One customer's CardCode.
    - resolve:
        entity: model.Customer
        strategy: probabilistic
        autoMatchAbove: 0.95
        match:
          - { field: customerRef, kind: email }
          - { field: customerRef, kind: domain }
    - map:
        from: model.SalesOrder
        to: model.SalesOrder
        mapping: sales-order-to-business-one-order@1
    - write:
        target: business-one
        operation: create-sales-order
        idempotencyKey: "SHOPIFY-{{ source.id }}"
        simulate: true
        output: erpOrder
        # The ERP's order, linked to its Shopify order.
        link: { entity: model.SalesOrder, id: DocEntry, master: shopifyId }
    - map:
        from: model.SalesOrder
        to: model.Order
        mapping: sales-order-to-shopify-note@1
    - write:
        target: shopify-store
        operation: update-order
        idempotencyKey: "SHOPIFY-{{ source.id }}"
        simulate: true
  policies: [writeback-default]
  capacity:
    peakPerSecond: 1
  slo:
    p95Latency: 10s
