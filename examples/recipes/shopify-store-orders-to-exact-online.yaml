# The Shopify saga with Exact Online as the ERP: each new (paid) Shopify
# order becomes an Exact sales order (a retried create finds the first
# one's order by YourRef), and its order number is noted on the Shopify
# order. If the note cannot be written, the order is deleted.
apiVersion: turgon.dev/v1alpha1
kind: Recipe
metadata:
  name: shopify-store-orders-to-exact-online
  version: 1.0.0
  description: "A paid Shopify order becomes an Exact Online sales order; its number is added to the Shopify order as a note."
spec:
  trigger:
    source: shopify-store
    event: Order.Created
  steps:
    - map:
        from: shopify-store.Order
        to: model.SalesOrder
        mapping: shopify-rest-order-to-order@1
    # The master record's ID is the Exact account's ID.
    - resolve:
        entity: model.Customer
        strategy: probabilistic
        autoMatchAbove: 0.95
        match:
          - { field: customerRef, kind: email }
          - { field: customerRef, kind: domain }
    - map:
        from: model.SalesOrder
        to: model.SalesOrder
        mapping: sales-order-to-exact-online-order@1
    - write:
        target: exact-online
        operation: create-sales-order
        idempotencyKey: "SHOPIFY-{{ source.id }}"
        simulate: true
        output: erpOrder
    - map:
        from: model.SalesOrder
        to: model.Order
        mapping: sales-order-to-shopify-note@1
    - write:
        target: shopify-store
        operation: update-order
        idempotencyKey: "SHOPIFY-{{ source.id }}"
        simulate: true
  policies: [writeback-default]
  capacity:
    peakPerSecond: 0.5
  slo:
    p95Latency: 10s
