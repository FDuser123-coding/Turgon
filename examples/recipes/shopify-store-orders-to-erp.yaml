# A saga between a SaaS shop and the ERP: each new Shopify order becomes an
# ERP sales order, and the ERP order number is noted on the Shopify order.
# If the note cannot be written, the ERP order is cancelled.
apiVersion: turgon.dev/v1alpha1
kind: Recipe
metadata:
  name: shopify-store-orders-to-erp
  version: 1.0.0
spec:
  trigger:
    source: shopify-store
    event: Order.Created
  steps:
    - map:
        from: shopify-store.Order
        to: model.SalesOrder
        mapping: shopify-rest-order-to-order@1
    # A known buyer's address links at once; a new buyer at a known company
    # goes to a data steward with the company suggested, and once confirmed
    # the address is known.
    - resolve:
        entity: model.Customer
        strategy: probabilistic
        autoMatchAbove: 0.95
        match:
          - { field: customerRef, kind: email }
          - { field: customerRef, kind: domain }
    - write:
        target: erp-db
        operation: create-sales-order
        idempotencyKey: "{{ source.admin_graphql_api_id }}"
        simulate: true
        output: erpOrder
    - map:
        from: model.SalesOrder
        to: model.Order
        mapping: sales-order-to-shopify-note@1
    - write:
        target: shopify-store
        operation: update-order
        idempotencyKey: "{{ source.admin_graphql_api_id }}"
        simulate: true
  policies: [writeback-default]
  capacity:
    peakPerSecond: 1
  slo:
    p95Latency: 10s
