# The Shopify saga through the GraphQL Admin API: each new order becomes an
# ERP sales order (a person approves it), then the ERP order number is
# written into the order's note. If Shopify refuses the note, the ERP order
# is cancelled; if a later step fails, the note is restored.
apiVersion: turgon.dev/v1alpha1
kind: Recipe
metadata:
  name: shopify-admin-orders-to-erp
  version: 1.0.0
  description: "A Shopify order, read through the GraphQL Admin API, becomes an ERP sales order; the ERP number is noted on the order."
spec:
  trigger:
    source: shopify-admin
    event: Order.Created
  steps:
    - map:
        from: shopify-admin.Order
        to: model.SalesOrder
        mapping: shopify-admin-order-to-order@1
    - resolve:
        entity: model.Customer
        strategy: probabilistic
        autoMatchAbove: 0.95
        match:
          - { field: customerRef, kind: email }
          - { field: customerRef, kind: domain }
    - write:
        target: erp-db
        operation: create-sales-order
        idempotencyKey: "{{ source.admin_graphql_api_id }}"
        simulate: true
        output: erpOrder
    - map:
        from: model.SalesOrder
        to: model.Order
        mapping: sales-order-to-shopify-note@1
    - write:
        target: shopify-admin
        operation: update-order
        idempotencyKey: "{{ source.admin_graphql_api_id }}"
        simulate: true
  policies: [writeback-default]
  capacity:
    peakPerSecond: 1
  slo:
    p95Latency: 10s
