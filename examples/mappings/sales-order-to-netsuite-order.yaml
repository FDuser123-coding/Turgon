# A sales order in NetSuite's shape. NetSuite references items by internal
# ID; this account's SKUs map to them here (maintained per deployment).
# Shopify's order ID rides along for the write-back.
apiVersion: turgon.dev/v1alpha1
kind: Mapping
metadata:
  name: sales-order-to-netsuite-order
  version: 1.0.0
spec:
  from: model.SalesOrder
  to: model.SalesOrder
  fields:
    - { target: customerId, expression: "customerId",                 origin: human, confidence: 1.0 }
    - { target: orderDate,  expression: "orderDate",                  origin: human, confidence: 1.0 }
    - { target: memo,       expression: "'Shopify ' & externalId",    origin: human, confidence: 0.95 }
    - target: netsuiteItems
      expression: "lines.{ 'item': { 'id': $lookup({ 'M-1': '101', 'M-2': '102' }, material) }, 'quantity': quantity }[]"
      origin: human
      confidence: 0.95
    - { target: shopifyId,  expression: "shopifyId",                  origin: human, confidence: 1.0 }
