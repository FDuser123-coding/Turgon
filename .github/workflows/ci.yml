name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Validate, verify and compile the example catalog
        run: |
          go run ./cmd/porter validate examples
          go run ./cmd/porter verify -c examples eu-distributor-core
          go run ./cmd/porter compile -c examples eu-distributor-core -o /dev/null
