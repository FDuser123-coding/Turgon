name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: turgon
          POSTGRES_PASSWORD: turgon
          POSTGRES_DB: turgon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U turgon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TURGON_TEST_DATABASE_URL: postgres://turgon:turgon@localhost:5432/turgon_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test (unit, Postgres integration, Temporal workflow)
        run: go test -race ./...
      - name: Validate, verify and compile the example catalog
        run: |
          go run ./cmd/turgon validate examples
          go run ./cmd/turgon verify -c examples eu-distributor-core
          go run ./cmd/turgon verify -c examples shop-orders-to-erp
          go run ./cmd/turgon compile -c examples eu-distributor-core -o /dev/null
          go run ./cmd/turgon compile -c examples shop-orders-to-erp -o /dev/null
          go run ./cmd/turgon compile -c examples salesforce-won-deals-to-erp -o /dev/null
          go run ./cmd/turgon compile -c examples shopify-store-orders-to-erp -o /dev/null
          go run ./cmd/turgon compile -c examples stripe-payments-to-erp -o /dev/null

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Vercel demo build lands in console/dist
        run: VERCEL=1 npm run build && test -f dist/index.html
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build turgon with the console embedded
        working-directory: .
        run: go build -o /tmp/turgon ./cmd/turgon

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Install kubeconform and hadolint
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          curl -sSL -o /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
      - name: Compile example specs
        run: |
          go run ./cmd/turgon compile -c examples shop-orders-to-erp -o /tmp/shop.json
          go run ./cmd/turgon compile -c examples salesforce-won-deals-to-erp -o /tmp/sf.json
      - name: Lint, render and validate the chart
        run: |
          set -o pipefail
          args=(--set database.cloudNativePG.enabled=true --set 'console.auth.trustedProxies={10.0.0.0/8}'
                --set console.auth.approverGroup=turgon-approvers --set console.auth.stewardGroup=turgon-stewards --set networkPolicy.allowAllEgress=false
                --set-file specs.shop-orders-to-erp=/tmp/shop.json --set-file specs.salesforce-won-deals-to-erp=/tmp/sf.json
                --set agents.enabled=true --set 'agents.writes={shop-orders-to-erp}' --set agents.gateway.rateLimit=100/1m
                --set agents.gateway.issuer=https://login.example.com --set agents.gateway.jwksURL=https://login.example.com/jwks
                --set 'agents.gateway.audiences={turgon}' --set agents.gateway.ingress.enabled=true
                --set agents.gateway.ingress.host=agents.example.com)
          helm lint deploy/helm/turgon "${args[@]}"
          helm template turgon deploy/helm/turgon --kube-version 1.31.0 "${args[@]}" > /tmp/rendered.yaml
          ~/go/bin/kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered.yaml deploy/flux/turgon.yaml deploy/kyverno/verify-turgon-images.yaml
      - name: Lint the Dockerfile
        run: hadolint Dockerfile

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      - run: cd console && npm ci
      - name: Check every shipped dependency against the license policy
        run: PATH="$HOME/go/bin:$PATH" scripts/check-licenses.sh
      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$HOME/go/bin/actionlint"
