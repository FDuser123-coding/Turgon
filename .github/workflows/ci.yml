name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: turgon
          POSTGRES_PASSWORD: turgon
          POSTGRES_DB: turgon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U turgon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TURGON_TEST_DATABASE_URL: postgres://turgon:turgon@localhost:5432/turgon_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Logical replication on the test database (change capture tests)
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U turgon -d turgon_test -c "ALTER SYSTEM SET wal_level = logical"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U turgon; do sleep 1; done
      - name: Generated code is up to date (operator deep copies and CRD)
        run: |
          make generate
          git diff --exit-code apis deploy/helm/turgon/crds
      - name: kube-apiserver and etcd for the operator's tests (envtest)
        run: |
          make envtest
          echo "KUBEBUILDER_ASSETS=$PWD/bin/envtest" >> "$GITHUB_ENV"
      - name: Test (unit, Postgres integration, Temporal workflow, operator)
        run: go test -race ./...
      - name: Known vulnerabilities in reachable code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Restore drill (backup, restore, audit chain, tamper check)
        env:
          PGPASSWORD: turgon
        run: |
          go build -o bin/turgon ./cmd/turgon
          base=postgres://turgon:turgon@localhost:5432
          psql -q "$base/postgres" -c 'CREATE DATABASE drill_src'
          for who in ada bob; do
            bin/turgon xref set --database-url "$base/drill_src?sslmode=disable" --entity Customer --system shop-db \
              --source "$who@example.com" --master "C-$who" --by ci
          done
          scripts/restore-drill.sh "$base/drill_src?sslmode=disable" "$base/drill_dst?sslmode=disable"
      - name: Validate, verify and compile the example catalog
        run: |
          go run ./cmd/turgon validate examples
          go run ./cmd/turgon verify -c examples eu-distributor-core
          go run ./cmd/turgon verify -c examples shop-orders-to-erp
          go run ./cmd/turgon verify -c examples shop-order-rows-to-erp
          go run ./cmd/turgon verify -c examples salesforce-won-deals-to-erp-cdc
          go run ./cmd/turgon compile -c examples eu-distributor-core -o /dev/null
          go run ./cmd/turgon compile -c examples shop-orders-to-erp -o /dev/null
          go run ./cmd/turgon compile -c examples salesforce-won-deals-to-erp -o /dev/null
          go run ./cmd/turgon compile -c examples shopify-store-orders-to-erp -o /dev/null
          go run ./cmd/turgon compile -c examples stripe-payments-to-erp -o /dev/null
          go run ./cmd/turgon compile -c examples hubspot-won-deals-to-erp -o /dev/null
          go run ./cmd/turgon compile -c examples shopify-store-orders-to-s4 -o /dev/null
          go run ./cmd/turgon compile -c examples hubspot-won-deals-to-dynamics -o /dev/null
          go run ./cmd/turgon compile -c examples shopify-store-orders-to-netsuite -o /dev/null

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Vercel demo build lands in console/dist
        run: VERCEL=1 npm run build && test -f dist/index.html
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build turgon with the console embedded
        working-directory: .
        run: go build -o /tmp/turgon ./cmd/turgon

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Install kubeconform and hadolint
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          curl -sSL -o /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz \
            | tar xz -C /tmp prometheus-3.5.0.linux-amd64/promtool
          sudo mv /tmp/prometheus-3.5.0.linux-amd64/promtool /usr/local/bin/promtool
      - name: Compile example specs
        run: |
          go run ./cmd/turgon compile -c examples shop-orders-to-erp -o /tmp/shop.json
          go run ./cmd/turgon compile -c examples salesforce-won-deals-to-erp -o /tmp/sf.json
          go run ./cmd/turgon compile -c examples stripe-payments-to-erp -o /tmp/stripe.json
          go run ./cmd/turgon keygen --out /tmp/ci-signing
          go run ./cmd/turgon sign /tmp/shop.json --key /tmp/ci-signing.key
      - name: Lint, render and validate the chart
        run: |
          set -o pipefail
          args=(--set database.cloudNativePG.enabled=true --set 'console.auth.trustedProxies={10.0.0.0/8}'
                --set console.auth.approverGroup=turgon-approvers --set console.auth.stewardGroup=turgon-stewards --set console.auth.operatorGroup=turgon-operators --set networkPolicy.allowAllEgress=false
                --set-file specs.shop-orders-to-erp=/tmp/shop.json --set-file specs.salesforce-won-deals-to-erp=/tmp/sf.json
                --set agents.enabled=true --set 'agents.writes={shop-orders-to-erp}' --set agents.gateway.rateLimit=100/1m
                --set agents.gateway.issuer=https://login.example.com --set agents.gateway.jwksURL=https://login.example.com/jwks
                --set 'agents.gateway.audiences={turgon}' --set agents.gateway.ingress.enabled=true
                --set agents.gateway.ingress.host=agents.example.com
                --set-file specs.stripe-payments-to-erp=/tmp/stripe.json --set workers.webhooks.enabled=true
                --set workers.webhooks.ingress.enabled=true --set workers.webhooks.ingress.host=hooks.example.com
                --set workers.consoleURL=https://turgon.example.com)
          helm lint deploy/helm/turgon "${args[@]}"
          helm template turgon deploy/helm/turgon --kube-version 1.31.0 "${args[@]}" > /tmp/rendered.yaml
          # The console signing people in itself, instead of behind a proxy.
          helm template turgon deploy/helm/turgon --kube-version 1.31.0 "${args[@]}" --set console.auth.mode=oidc \
            --set console.auth.oidc.issuer=https://login.example.com --set console.auth.oidc.clientID=turgon \
            --set console.auth.oidc.url=https://turgon.example.com --set console.auth.oidc.existingSecret=turgon-console-oidc \
            > /tmp/rendered-oidc.yaml
          # Temporal over mutual TLS, with an API key and payload encryption.
          helm template turgon deploy/helm/turgon --kube-version 1.31.0 "${args[@]}" --set temporal.tls.enabled=true \
            --set temporal.tls.existingSecret=temporal-mtls --set temporal.tls.caKey=ca.crt --set temporal.tls.certKey=tls.crt \
            --set temporal.tls.keyKey=tls.key --set temporal.existingSecret=turgon-temporal > /tmp/rendered-tls.yaml
          grep -q 'secretName: temporal-mtls' /tmp/rendered-tls.yaml
          # Specs loaded only if signed by a trusted key.
          helm template turgon deploy/helm/turgon --kube-version 1.31.0 "${args[@]}" \
            --set-file specSigning.trustedKeys=/tmp/ci-signing.pub > /tmp/rendered-signed.yaml
          grep -q 'TURGON_TRUSTED_KEYS' /tmp/rendered-signed.yaml
          # Metrics scraping and alerts, with one latency SLO alert per recipe.
          helm template turgon deploy/helm/turgon --kube-version 1.31.0 "${args[@]}" --set monitoring.podMonitor.enabled=true \
            --set monitoring.rules.enabled=true > /tmp/rendered-monitoring.yaml
          python3 -c 'import sys, yaml; r = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d and d["kind"] == "PrometheusRule"][0]; yaml.safe_dump({"groups": r["spec"]["groups"]}, open(sys.argv[2], "w"))' \
            /tmp/rendered-monitoring.yaml deploy/helm/turgon/ci/rules.yaml
          promtool check rules deploy/helm/turgon/ci/rules.yaml
          promtool test rules deploy/helm/turgon/ci/alerts-test.yaml
          # Continuous backup to object storage, and a cluster restored from it to a point in time.
          backup=(--set database.cloudNativePG.backup.enabled=true --set database.cloudNativePG.backup.destinationPath=s3://turgon-backups/prod
                  --set database.cloudNativePG.backup.credentialsSecret=turgon-backup-s3)
          helm template turgon deploy/helm/turgon --kube-version 1.31.0 "${args[@]}" "${backup[@]}" > /tmp/rendered-backup.yaml
          helm template turgon deploy/helm/turgon --kube-version 1.31.0 "${args[@]}" "${backup[@]}" \
            --set database.cloudNativePG.recovery.enabled=true --set 'database.cloudNativePG.recovery.targetTime=2026-09-28 10:00:00+00' \
            --set database.cloudNativePG.backup.serverName=turgon-turgon-db-2 > /tmp/rendered-restore.yaml
          # A restored cluster archiving over its source is refused.
          if helm template turgon deploy/helm/turgon --kube-version 1.31.0 "${args[@]}" "${backup[@]}" --set database.cloudNativePG.recovery.enabled=true >/dev/null 2>&1; then
            echo "a restore archiving over its source was not refused"; exit 1
          fi
          # With the operator, specs become Integrations; the operator
          # accepts what the chart renders for it.
          helm template turgon deploy/helm/turgon -n turgon --kube-version 1.31.0 "${args[@]}" --set operator.enabled=true \
            --set monitoring.rules.enabled=true --set-file specSigning.trustedKeys=/tmp/ci-signing.pub > /tmp/rendered-operator.yaml
          # Only the shop spec is signed: with trusted keys the others are refused.
          if go run ./cmd/turgon-operator --validate /tmp/rendered-operator.yaml --trusted-keys /tmp/ci-signing.pub; then
            echo "unsigned specs were accepted"; exit 1
          fi
          helm template turgon deploy/helm/turgon -n turgon --kube-version 1.31.0 "${args[@]}" --set operator.enabled=true \
            --set monitoring.rules.enabled=true > /tmp/rendered-operator-unsigned.yaml
          go run ./cmd/turgon-operator --validate /tmp/rendered-operator-unsigned.yaml
          mkdir -p /tmp/schemas
          python3 -c 'import sys, yaml, json; c = yaml.safe_load(open(sys.argv[1])); json.dump(c["spec"]["versions"][0]["schema"]["openAPIV3Schema"], open(sys.argv[2], "w"))' \
            deploy/helm/turgon/crds/turgon.dev_integrations.yaml /tmp/schemas/integration_v1alpha1.json
          ~/go/bin/kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default -schema-location '/tmp/schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered.yaml /tmp/rendered-oidc.yaml /tmp/rendered-tls.yaml /tmp/rendered-monitoring.yaml \
            /tmp/rendered-backup.yaml /tmp/rendered-restore.yaml /tmp/rendered-signed.yaml /tmp/rendered-operator.yaml \
            /tmp/rendered-operator-unsigned.yaml deploy/flux/turgon.yaml deploy/kyverno/verify-turgon-images.yaml
      - name: Lint the Dockerfile
        run: hadolint Dockerfile

  appliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the offline bundle
        run: scripts/build-appliance.sh ci amd64
      - name: A tampered bundle is refused; an intact one installs
        run: |
          mkdir /tmp/bundle && tar -C /tmp/bundle -xzf dist/turgon-appliance-ci-linux-amd64.tar.gz
          cd /tmp/bundle/turgon-appliance-ci-linux-amd64
          echo "# tampered" >> turgon.env.example
          if ./install.sh --root /tmp/root; then echo "a tampered bundle was installed"; exit 1; fi
          sed -i '$d' turgon.env.example
          ./install.sh --root /tmp/root
          test "$(stat -c %a /tmp/root/etc/turgon/turgon.env)" = 640
          /tmp/root/opt/turgon/bin/temporal --version | grep -q 'temporal version 1.4.1'
          /tmp/root/opt/turgon/bin/turgon appliance run --help >/dev/null
      - name: The systemd units are valid and sandboxed
        run: |
          set -o pipefail
          sudo ln -s /tmp/root/opt/turgon /opt/turgon
          sudo useradd --system --no-create-home turgon
          systemd-analyze verify /tmp/root/etc/systemd/system/turgon-*.service
          for u in /tmp/root/etc/systemd/system/turgon-*.service; do
            systemd-analyze security --offline=yes --threshold=3 "$u" | tail -1
          done

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      - run: cd console && npm ci
      - name: Check every shipped dependency against the license policy
        run: PATH="$HOME/go/bin:$PATH" scripts/check-licenses.sh
      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$HOME/go/bin/actionlint"
