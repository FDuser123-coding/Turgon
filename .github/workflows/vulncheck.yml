# Known vulnerabilities in reachable code, every night on main. A new Go or
# module advisory otherwise first shows as a failing pull request that did
# not cause it; this finds it the night it is published, and opens an issue
# (or comments on the open one) so it is fixed before it blocks anyone.
name: vulncheck

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Known vulnerabilities in reachable code
        id: check
        run: |
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./... > report.txt 2>&1
          status=$?
          cat report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open or update the vulnerability issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="govulncheck: known vulnerabilities in reachable code"
          {
            echo "The nightly govulncheck on main failed: $RUN_URL"
            echo
            echo '```'
            grep -E '^(Vulnerability #|    [A-Z]|  More info|    Found in|    Fixed in)' report.txt || tail -40 report.txt
            echo '```'
          } > body.md
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
          exit 1
