# A test plugin for turgon:stack/logic-plugin@0.2.0: HTTP, secrets in
# headers, events, and the unavailable error.
# Rebuild the committed module with scripts/build-plugins.sh (CI checks it
# matches these sources).
[package]
name = "probe2"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
wit-bindgen = "=0.46.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[workspace]
